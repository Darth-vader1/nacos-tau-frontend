<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>Admin Login - NACOS</title>
  <link href="assets/img/tau_logo-removebg-preview.png" rel="icon">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  
  <style>
    body {
      background: linear-gradient(135deg, #f5f5f5 0%, #e8f5e9 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    
    .login-card {
      max-width: 450px;
      width: 100%;
      margin: 20px;
      background: white;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.1);
      overflow: hidden;
    }
    
    .login-header {
      background: linear-gradient(135deg, #1b8c0c 0%, #0d5c08 100%);
      padding: 30px;
      text-align: center;
    }
    
    .login-header img {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: white;
      padding: 10px;
      margin-bottom: 15px;
    }
    
    .login-header h3 {
      color: white;
      margin: 0;
      font-size: 24px;
    }
    
    .login-header p {
      color: rgba(255,255,255,0.8);
      margin: 5px 0 0;
      font-size: 14px;
    }
    
    .login-body {
      padding: 30px;
    }
    
    .form-group {
      margin-bottom: 20px;
    }
    
    .form-group label {
      font-weight: 500;
      margin-bottom: 8px;
      display: block;
      color: #333;
    }
    
    .form-control {
      width: 100%;
      padding: 12px 15px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 14px;
    }
    
    .form-control:focus {
      outline: none;
      border-color: #1b8c0c;
      box-shadow: 0 0 0 3px rgba(27,140,12,0.1);
    }
    
    .btn-login {
      width: 100%;
      padding: 12px;
      background: #1b8c0c;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }
    
    .btn-login:hover {
      background: #0d5c08;
    }
    
    .btn-login:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }
    
    .spinner-border {
      display: inline-block;
      width: 1rem;
      height: 1rem;
      border: 0.2em solid currentColor;
      border-right-color: transparent;
      border-radius: 50%;
      animation: spinner-border 0.75s linear infinite;
    }
    
    @keyframes spinner-border {
      to { transform: rotate(360deg); }
    }
    
    .password-container {
      position: relative;
    }
    
    .toggle-password {
      position: absolute;
      right: 12px;
      top: 70%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: #999;
    }
    
    .footer-links {
      text-align: center;
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px solid #eee;
    }
    
    .footer-links a {
      color: #1b8c0c;
      text-decoration: none;
      font-size: 14px;
    }
  </style>
</head>

<body>

<div class="login-card">
  <div class="login-header">
    <img src="assets/img/tau_logo-removebg-preview.png" alt="TAU Logo">
    <h3>NACOS Admin Portal</h3>
    <p>Secure access for administrators</p>
  </div>
  
  <div class="login-body">
    <form id="adminLoginForm">
      <div class="form-group">
        <label for="email">Admin Email</label>
        <input type="email" class="form-control" id="email" placeholder="admin@tau.edu.ng" required autocomplete="email" autofocus>
      </div>
      
      <div class="form-group">
        <label for="password">Password</label>
        <div class="password-container">
          <input type="password" class="form-control" id="password" placeholder="Enter your password" required autocomplete="current-password">
          <button type="button" class="toggle-password" id="togglePassword">
            <i class="bi bi-eye-slash"></i>
          </button>
        </div>
      </div>
      
      <button type="submit" class="btn-login" id="loginBtn">
        Sign In
      </button>
    </form>
    
    <div class="footer-links">
      <a href="student-login.html">← Student Login</a>
      &nbsp;|&nbsp;
      <a href="index.html">Back to Home</a>
    </div>
  </div>
</div>

<script src="config.local.js"></script>
<script type="module">
  import { supabase } from './assets/js/supabase-config.js';
  
  console.log('Admin login page loaded');
  
  const form = document.getElementById('adminLoginForm');
  const emailInput = document.getElementById('email');
  const passwordInput = document.getElementById('password');
  const loginBtn = document.getElementById('loginBtn');
  const togglePassword = document.getElementById('togglePassword');
  
  // Toggle password visibility
  togglePassword.addEventListener('click', () => {
    const type = passwordInput.type === 'password' ? 'text' : 'password';
    passwordInput.type = type;
    const icon = togglePassword.querySelector('i');
    icon.classList.toggle('bi-eye');
    icon.classList.toggle('bi-eye-slash');
  });
  
  // Check if already logged in
  async function checkExistingSession() {
    const { data: { session } } = await supabase.auth.getSession();
    if (session) {
      // Check if user is admin
      const { data: adminData } = await supabase
        .from('admin_users')
        .select('id')
        .eq('user_id', session.user.id)
        .single();
      
      if (adminData) {
        window.location.href = 'admin-dashboard.html';
      }
    }
  }
  
  checkExistingSession();
  
  // Handle login
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    
    const email = emailInput.value.trim().toLowerCase();
    const password = passwordInput.value;
    
    if (!email || !password) {
      Swal.fire('Error', 'Please enter both email and password', 'warning');
      return;
    }
    
    // Allow both @tau.edu.ng and @st.tau.edu.ng
    if (!email.endsWith('@tau.edu.ng') && !email.endsWith('@st.tau.edu.ng')) {
      Swal.fire('Error', 'Please use a valid @tau.edu.ng or @st.tau.edu.ng email', 'warning');
      return;
    }
    
    loginBtn.disabled = true;
    loginBtn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Signing in...';
    
    try {
      const { data, error } = await supabase.auth.signInWithPassword({
        email: email,
        password: password
      });
      
      if (error) throw error;
      
      // Check if user is admin
      const { data: adminData, error: adminError } = await supabase
        .from('admin_users')
        .select('id, role')
        .eq('user_id', data.user.id)
        .single();
      
      if (adminError || !adminData) {
        await supabase.auth.signOut();
        throw new Error('Not authorized as admin');
      }
      
      Swal.fire({
        title: 'Welcome!',
        text: 'Redirecting to admin dashboard...',
        icon: 'success',
        timer: 1500,
        showConfirmButton: false
      });
      
      setTimeout(() => {
        window.location.href = 'admin-dashboard.html';
      }, 1500);
      
    } catch (error) {
      console.error('Login error:', error);
      Swal.fire('Access Denied', 'Invalid credentials or you do not have admin privileges', 'error');
    } finally {
      loginBtn.disabled = false;
      loginBtn.innerHTML = 'Sign In';
    }
  });
</script>

</body>
</html>
