<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Admin Login - NACOS</title>
    <link href="assets/img/tau_logo-removebg-preview.png" rel="icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <style>
        body {
            background: linear-gradient(135deg, #f5f5f5 0%, #e8f5e9 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        .login-card {
            max-width: 450px;
            width: 100%;
            margin: 20px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.1);
            overflow: hidden;
            animation: fadeInUp 0.5s ease;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .login-header {
            background: linear-gradient(135deg, #1b8c0c 0%, #0d5c08 100%);
            padding: 30px;
            text-align: center;
        }
        
        .login-header img {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: white;
            padding: 10px;
            margin-bottom: 15px;
        }
        
        .login-header h3 {
            color: white;
            margin: 0;
            font-size: 24px;
        }
        
        .login-header p {
            color: rgba(255,255,255,0.8);
            margin: 5px 0 0;
            font-size: 14px;
        }
        
        .login-body {
            padding: 30px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            font-weight: 500;
            margin-bottom: 8px;
            display: block;
            color: #333;
            font-size: 14px;
        }
        
        .form-control {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e9ecef;
            border-radius: 12px;
            font-size: 14px;
            transition: all 0.3s;
        }
        
        .form-control:focus {
            outline: none;
            border-color: #1b8c0c;
            box-shadow: 0 0 0 4px rgba(27,140,12,0.1);
        }
        
        .form-control-icon {
            position: relative;
        }
        
        .form-control-icon i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #adb5bd;
        }
        
        .form-control-icon .form-control {
            padding-left: 45px;
        }
        
        .btn-login {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #1b8c0c 0%, #0d5c08 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(27,140,12,0.3);
        }
        
        .btn-login:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }
        
        .spinner-border-sm {
            display: inline-block;
            width: 1rem;
            height: 1rem;
            border: 0.2em solid currentColor;
            border-right-color: transparent;
            border-radius: 50%;
            animation: spinner-border 0.75s linear infinite;
        }
        
        @keyframes spinner-border {
            to { transform: rotate(360deg); }
        }
        
        .password-container {
            position: relative;
        }
        
        .toggle-password {
            position: absolute;
            right: 15px;
            top: 70%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            color: #999;
            padding: 5px;
        }
        
        .toggle-password:hover {
            color: #333;
        }
        
        .admin-info {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 15px;
            margin: 20px 0;
            border-left: 4px solid #1b8c0c;
        }
        
        .admin-info small {
            color: #666;
            font-size: 12px;
        }
        
        .admin-info .key {
            color: #1b8c0c;
            font-weight: 600;
        }
        
        .footer-links {
            text-align: center;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #eee;
        }
        
        .footer-links a {
            color: #1b8c0c;
            text-decoration: none;
            font-size: 14px;
            margin: 0 10px;
            transition: color 0.3s;
        }
        
        .footer-links a:hover {
            color: #0d5c08;
            text-decoration: underline;
        }
        
        .badge-admin {
            display: inline-block;
            background: rgba(255,255,255,0.2);
            color: white;
            font-size: 11px;
            font-weight: 700;
            padding: 4px 12px;
            border-radius: 20px;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-top: 8px;
        }

        #preloader {
            display: none !important;
        }

        /* Responsive */
        @media (max-width: 576px) {
            .login-body {
                padding: 20px;
            }
            .login-header {
                padding: 20px;
            }
        }
    </style>
</head>

<body>

<div class="login-card">
    <div class="login-header">
        <img src="assets/img/tau_logo-removebg-preview.png" alt="TAU Logo">
        <h3>NACOS Admin Portal</h3>
        <span class="badge-admin">🔒 Secure Access</span>
        <p>Administrators only</p>
    </div>
    
    <div class="login-body">
        <form id="adminLoginForm" novalidate>
            <div class="form-group">
                <label for="email">Admin Email</label>
                <div class="form-control-icon">
                    <i class="bi bi-envelope"></i>
                    <input type="email" class="form-control" id="email" 
                           placeholder="admin@tau.edu.ng" 
                           value="nacos@tau.edu.ng"
                           required autocomplete="email" autofocus>
                </div>
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <div class="password-container form-control-icon">
                    <i class="bi bi-lock"></i>
                    <input type="password" class="form-control" id="password" 
                           placeholder="Enter your secure password" 
                           required autocomplete="current-password">
                    <button type="button" class="toggle-password" id="togglePassword" aria-label="Toggle password visibility">
                        <i class="bi bi-eye-slash"></i>
                    </button>
                </div>
            </div>
            
            <div class="form-group d-flex justify-content-between align-items-center">
                <div class="form-check">
                    <input type="checkbox" class="form-check-input" id="rememberAdmin">
                    <label class="form-check-label" for="rememberAdmin">Remember me</label>
                </div>
                <a href="forgot-password.html" style="color: #1b8c0c; font-size: 14px;">Forgot Password?</a>
            </div>
            
            <button type="submit" class="btn-login" id="loginBtn">
                <span id="loginText"><i class="bi bi-box-arrow-in-right"></i> Sign In</span>
                <span id="loginSpinner" style="display: none;">
                    <span class="spinner-border-sm" role="status"></span>
                    Authenticating...
                </span>
            </button>
        </form>
        
        <div class="footer-links">
            <a href="student-login.html"><i class="bi bi-person"></i> Student Login</a>
            <a href="index.html"><i class="bi bi-house"></i> Home</a>
        </div>
    </div>
</div>

<script src="assets/js/env.js"></script>
<script type="module" src="assets/js/supabase-config.js"></script>
<script type="module" src="assets/js/api-config.js"></script>
<script type="module">
    import { supabase } from './assets/js/supabase-config.js';
    
    console.log('🔐 Admin login page loaded');
    
    const form = document.getElementById('adminLoginForm');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const loginBtn = document.getElementById('loginBtn');
    const loginText = document.getElementById('loginText');
    const loginSpinner = document.getElementById('loginSpinner');
    const togglePassword = document.getElementById('togglePassword');
    const rememberCheck = document.getElementById('rememberAdmin');
    
    // Load remembered admin email
    const rememberedAdmin = localStorage.getItem('remembered_admin');
    if (rememberedAdmin) {
        emailInput.value = rememberedAdmin;
        rememberCheck.checked = true;
    }
    
    // Toggle password visibility
    togglePassword.addEventListener('click', () => {
        const type = passwordInput.type === 'password' ? 'text' : 'password';
        passwordInput.type = type;
        const icon = togglePassword.querySelector('i');
        icon.classList.toggle('bi-eye');
        icon.classList.toggle('bi-eye-slash');
    });
    
    // Check if already logged in
    async function checkExistingSession() {
        try {
            const { data: { session } } = await supabase.auth.getSession();
            if (session) {
                // Check if user is admin
                const { data: adminData } = await supabase
                    .from('admin_users')
                    .select('id, role')
                    .eq('user_id', session.user.id)
                    .single();
                
                if (adminData) {
                    console.log('✅ Already logged in as admin');
                    window.location.href = 'admin-dashboard.html';
                }
            }
        } catch (error) {
            console.error('Session check error:', error);
        }
    }
    
    checkExistingSession();
    
    // Handle login
    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const email = emailInput.value.trim().toLowerCase();
        const password = passwordInput.value;
        const remember = rememberCheck.checked;
        
        // Validate
        if (!email || !password) {
            Swal.fire({
                title: 'Missing Information',
                text: 'Please enter both email and password.',
                icon: 'warning',
                confirmButtonColor: '#1b8c0c'
            });
            return;
        }
        
        // Validate email format
        const emailRegex = /^[a-zA-Z0-9._%+-]+@(st\.)?tau\.edu\.ng$/;
        if (!emailRegex.test(email)) {
            Swal.fire({
                title: 'Invalid Email',
                text: 'Please use a valid @tau.edu.ng or @st.tau.edu.ng email',
                icon: 'warning',
                confirmButtonColor: '#1b8c0c'
            });
            return;
        }
        
        // Show loading
        loginBtn.disabled = true;
        loginText.style.display = 'none';
        loginSpinner.style.display = 'inline';
        
        try {
            // Attempt login
            const { data, error } = await supabase.auth.signInWithPassword({
                email: email,
                password: password
            });
            
            if (error) {
                console.error('Auth error:', error);
                throw new Error('Invalid credentials');
            }
            
            // Check if user is admin
            const { data: adminData, error: adminError } = await supabase
                .from('admin_users')
                .select('id, role, name')
                .eq('user_id', data.user.id)
                .single();
            
            if (adminError || !adminData) {
                // Not an admin - sign out immediately
                await supabase.auth.signOut();
                throw new Error('You do not have admin privileges');
            }
            
            // Save remember me
            if (remember) {
                localStorage.setItem('remembered_admin', email);
            } else {
                localStorage.removeItem('remembered_admin');
            }
            
            // Save admin session info
            sessionStorage.setItem('admin_role', adminData.role);
            sessionStorage.setItem('admin_name', adminData.name || 'Admin');
            
            console.log('✅ Admin login successful:', adminData);
            
            // Show success
            await Swal.fire({
                title: 'Welcome Admin!',
                text: `Access granted. Redirecting to dashboard...`,
                icon: 'success',
                timer: 1500,
                showConfirmButton: false,
                timerProgressBar: true
            });
            
            // Redirect
            window.location.href = 'admin-dashboard.html';
            
        } catch (error) {
            console.error('Login error:', error);
            
            let errorMessage = 'Invalid credentials or you do not have admin privileges.';
            if (error.message.includes('Invalid login credentials')) {
                errorMessage = 'Invalid email or password. Please try again.';
            } else if (error.message.includes('admin privileges')) {
                errorMessage = 'You do not have admin privileges. Please contact the system administrator.';
            }
            
            Swal.fire({
                title: 'Access Denied',
                text: errorMessage,
                icon: 'error',
                confirmButtonColor: '#1b8c0c',
                confirmButtonText: 'Try Again'
            });
            
            // Clear password
            passwordInput.value = '';
            passwordInput.focus();
            
        } finally {
            loginBtn.disabled = false;
            loginText.style.display = 'inline';
            loginSpinner.style.display = 'none';
        }
    });
    
    // Enter key support
    document.addEventListener('keypress', (e) => {
        if (e.key === 'Enter' && document.activeElement === passwordInput) {
            form.dispatchEvent(new Event('submit'));
        }
    });
</script>

</body>
</html>
