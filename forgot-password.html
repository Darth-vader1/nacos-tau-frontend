<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>Forgot Password | NACOS - Thomas Adewumi University</title>
  <meta name="description" content="Reset your NACOS account password by submitting your TAU email address.">
  <link href="assets/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
  <link href="assets/vendor/bootstrap-icons/bootstrap-icons.css" rel="stylesheet">
  <link href="assets/css/main.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    .loginForm { max-width: 600px; margin: 80px auto 40px; padding: 30px; background: white; border-radius: 12px; box-shadow: 0 16px 40px rgba(0,0,0,.08); }
    .logo-underlay { display: block; margin: 0 auto 20px; max-width: 80px; }
    .form-control { width: 100%; padding: 12px 14px; border: 1px solid #ddd; border-radius: 8px; }
    .form-control:focus { outline: none; border-color: #1b8c0c; box-shadow: 0 0 10px rgba(27,140,12,.15); }
    .btn-submit { background-color: #1b8c0c; color: white; border: none; padding: 12px 22px; border-radius: 8px; font-size: 16px; }
    .btn-submit:hover { background-color: #166a0a; }
    .text-muted.link { color: #1b8c0c; text-decoration: none; }
  </style>
</head>
<body>
  <main>
    <section class="starter-section section">
      <div class="loginForm">
        <img src="assets/img/tau_logo-removebg-preview.png" class="logo-underlay" alt="TAU Logo">
        <div class="container section-title" data-aos="fade-up">
          <h2>Forgot Password</h2>
          <p>Enter your TAU student email and we'll send a reset link.</p>
          <a href="student-login.html">Back to login</a>
        </div>

        <div class="container" data-aos="fade-up" style="margin: 0; padding: 0;">
          <form id="forgotPasswordForm">
            <div class="form-group">
              <label for="email">Student Email:</label>
              <input type="email" class="form-control" id="email" placeholder="name@st.tau.edu.ng" required autocomplete="email">
              <small class="text-muted">Enter the email address associated with your NACOS account.</small>
            </div>
            <div style="display:flex; justify-content:center; margin-top:24px;">
              <button type="submit" class="btn-submit">Send Reset Link</button>
            </div>
          </form>
        </div>
      </div>
    </section>
  </main>

  <script>
    const form = document.getElementById('forgotPasswordForm');
    form.addEventListener('submit', async event => {
      event.preventDefault();
      const email = document.getElementById('email').value.trim();

      if (!email) {
        Swal.fire('Missing email', 'Please enter your student email address.', 'warning');
        return;
      }

      try {
        const response = await fetch('/api/auth/forgot-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });

        const result = await response.json();
        if (!response.ok) {
          Swal.fire('Error', result.error || 'Unable to send reset link. Please try again.', 'error');
          return;
        }

        Swal.fire({
          title: 'Check your email',
          text: result.message || 'If your email is registered, you will receive a reset link.',
          icon: 'success',
          confirmButtonColor: '#1b8c0c'
        });
      } catch (err) {
        console.error('Forgot password submit error:', err);
        Swal.fire('Error', 'Unable to send reset link right now. Please try again later.', 'error');
      }
    });
  </script>
</body>
</html>
