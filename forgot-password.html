<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>Forgot Password | NACOS - Thomas Adewumi University</title>
  <meta name="description" content="Reset your NACOS account password by submitting your TAU email address.">
  <link href="assets/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
  <link href="assets/vendor/bootstrap-icons/bootstrap-icons.css" rel="stylesheet">
  <link href="assets/css/main.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    .loginForm { max-width: 600px; margin: 80px auto 40px; padding: 30px; background: white; border-radius: 12px; box-shadow: 0 16px 40px rgba(0,0,0,.08); }
    .logo-underlay { display: block; margin: 0 auto 20px; max-width: 80px; }
    .form-control { width: 100%; padding: 12px 14px; border: 1px solid #ddd; border-radius: 8px; }
    .form-control:focus { outline: none; border-color: #1b8c0c; box-shadow: 0 0 10px rgba(27,140,12,.15); }
    .btn-submit { background-color: #1b8c0c; color: white; border: none; padding: 12px 22px; border-radius: 8px; font-size: 16px; }
    .btn-submit:hover { background-color: #166a0a; }
    .text-muted.link { color: #1b8c0c; text-decoration: none; }
  </style>
</head>
<body>
  <main>
    <section class="starter-section section">
      <div class="loginForm">
        <img src="assets/img/tau_logo-removebg-preview.png" class="logo-underlay" alt="TAU Logo">
        <div class="container section-title" data-aos="fade-up">
          <h2>Forgot Password</h2>
          <p>Enter your TAU student email and we'll send a reset link.</p>
          <a href="student-login.html">Back to login</a>
        </div>

        <div class="container" data-aos="fade-up" style="margin: 0; padding: 0;">
          <form id="forgotPasswordForm">
            <div class="form-group">
              <label for="email">Student Email:</label>
              <input type="email" class="form-control" id="email" placeholder="name@st.tau.edu.ng" required autocomplete="email">
              <small class="text-muted">Enter the email address associated with your NACOS account.</small>
            </div>
            <div style="display:flex; justify-content:center; margin-top:24px;">
              <button type="submit" class="btn-submit">Send Reset Link</button>
            </div>
          </form>
        </div>
      </div>
    </section>
  </main>

  <script src="assets/js/env.js"></script>
  <script src="assets/js/security.js"></script> 
  <script type="module">
    import { supabase } from './assets/js/supabase-config.js';
    
    const form = document.getElementById('forgotPasswordForm');
    form.addEventListener('submit', async event => {
      event.preventDefault();
      const emailInput = document.getElementById('email');
      const email = emailInput.value.trim().toLowerCase();

      if (!email) {
        Swal.fire('Missing email', 'Please enter your student email address.', 'warning');
        return;
      }

      // Validate TAU student email
      const emailRegex = /^[a-zA-Z0-9._%+-]+@(st\.)?tau\.edu\.ng$/;
      if (!emailRegex.test(email)) {
        Swal.fire({
          title: 'Invalid Email',
          text: 'Please use your TAU student email address (@st.tau.edu.ng)',
          icon: 'warning',
          confirmButtonText: 'OK'
        });
        return;
      }

      // Disable form during submission
      const submitBtn = form.querySelector('button[type="submit"]');
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Sending...';

      try {
        // Determine the correct redirect URL based on environment
        let redirectUrl;
        if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
          // Local development - use current origin
          redirectUrl = `${window.location.origin}/reset-password.html`;
        } else {
          // Production - use deployed URL
          redirectUrl = `${window.location.origin}/reset-password.html`;
        }

        console.log('Reset password redirect URL:', redirectUrl);

        // Use Supabase's built-in password reset
        const { data, error } = await supabase.auth.resetPasswordForEmail(email, {
          redirectTo: redirectUrl,
        });

        if (error) {
          console.error('Reset password error:', error);
          throw error;
        }

        // Success - always show this message for security (don't reveal if email exists)
        await Swal.fire({
          title: 'Check your email',
          html: `
            <p>If an account exists with <strong>${email}</strong>, you will receive a password reset link shortly.</p>
            <p class="text-muted" style="margin-top: 15px; font-size: 14px;">
              Check your inbox and spam folder. The link expires in 1 hour.
            </p>
          `,
          icon: 'success',
          confirmButtonColor: '#1b8c0c',
          confirmButtonText: 'OK'
        });

        // Clear the form
        emailInput.value = '';
        
      } catch (err) {
        console.error('Forgot password submit error:', err);
        
        let errorMessage = 'Unable to send reset link right now. Please try again later.';
        
        // Handle specific error cases
        if (err.message?.includes('rate limit')) {
          errorMessage = 'Too many requests. Please wait a few minutes and try again.';
        } else if (err.message?.includes('Invalid email')) {
          errorMessage = 'Please enter a valid email address.';
        }
        
        await Swal.fire({
          title: 'Error',
          text: errorMessage,
          icon: 'error',
          confirmButtonColor: '#1b8c0c'
        });
      } finally {
        // Re-enable form
        submitBtn.disabled = false;
        submitBtn.innerHTML = 'Send Reset Link';
      }
    });
  </script>
</body>
</html>
