<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found | NACOS TAU</title>
  <link rel="icon" href="assets/img/tau_logo-removebg-preview.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

  <style>
    :root {
      --primary: #1b8c0c;
      --primary-dark: #126008;
      --primary-light: #e8f5e9;
      --bg: #0b0f17;
      --card-bg: rgba(18, 24, 38, 0.85);
      --card-border: rgba(255, 255, 255, 0.08);
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: radial-gradient(circle at 50% 10%, #132418 0%, var(--bg) 70%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      overflow-x: hidden;
      position: relative;
    }

    /* Ambient background glows */
    body::before, body::after {
      content: '';
      position: absolute;
      border-radius: 50%;
      filter: blur(100px);
      pointer-events: none;
      z-index: 0;
    }

    body::before {
      width: 320px;
      height: 320px;
      background: rgba(27, 140, 12, 0.22);
      top: 15%;
      left: 20%;
    }

    body::after {
      width: 280px;
      height: 280px;
      background: rgba(16, 185, 129, 0.15);
      bottom: 15%;
      right: 20%;
    }

    .error-container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 580px;
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 48px 36px;
      text-align: center;
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.6), 0 0 40px -10px rgba(27, 140, 12, 0.15);
    }

    .brand-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(27, 140, 12, 0.12);
      border: 1px solid rgba(27, 140, 12, 0.3);
      color: #4ade80;
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 24px;
      letter-spacing: 0.3px;
    }

    .brand-badge img {
      width: 18px;
      height: 18px;
      object-fit: contain;
    }

    .glitch-code {
      font-size: clamp(80px, 18vw, 130px);
      font-weight: 800;
      line-height: 1;
      letter-spacing: -3px;
      background: linear-gradient(135deg, #ffffff 30%, #4ade80 70%, #1b8c0c 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 12px;
      user-select: none;
    }

    .title {
      font-size: 24px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 12px;
    }

    .description {
      font-size: 15px;
      color: var(--text-muted);
      line-height: 1.6;
      margin-bottom: 32px;
      max-width: 440px;
      margin-left: auto;
      margin-right: auto;
    }

    .action-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 28px;
    }

    @media (min-width: 480px) {
      .action-group {
        flex-direction: row;
        justify-content: center;
      }
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 13px 24px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.2s ease;
      cursor: pointer;
    }

    .btn-primary {
      background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
      color: #ffffff;
      box-shadow: 0 4px 16px rgba(34, 197, 94, 0.3);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(34, 197, 94, 0.45);
      color: #ffffff;
    }

    .btn-outline {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #e5e7eb;
    }

    .btn-outline:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.25);
      color: #ffffff;
      transform: translateY(-2px);
    }

    .quick-links {
      border-top: 1px solid var(--card-border);
      padding-top: 20px;
      font-size: 13px;
      color: var(--text-muted);
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 16px;
    }

    .quick-links a {
      color: #9ca3af;
      text-decoration: none;
      transition: color 0.15s ease;
    }

    .quick-links a:hover {
      color: #4ade80;
    }

    .countdown {
      margin-top: 18px;
      font-size: 12px;
      color: #6b7280;
    }

    .countdown span {
      color: #4ade80;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div class="error-container">
    <div class="brand-badge">
      <img src="assets/img/tau_logo-removebg-preview.png" alt="TAU Logo" onerror="this.style.display='none'">
      <span>NACOS TAU CHAPTER</span>
    </div>

    <div class="glitch-code">404</div>

    <h1 class="title">Lost in Cyberspace?</h1>
    <p class="description">
      The page you're searching for doesn't exist, has been relocated, or the URL was mistyped.
    </p>

    <div class="action-group">
      <a href="/index.html" class="btn btn-primary">
        <i class="bi bi-house-door-fill"></i>
        <span>Return to Home</span>
      </a>
      <a href="/student-dashboard.html" class="btn btn-outline">
        <i class="bi bi-grid-fill"></i>
        <span>Student Dashboard</span>
      </a>
    </div>

    <div class="quick-links">
      <a href="/events.html"><i class="bi bi-calendar-event"></i> Events</a>
      <a href="/past-questions.html"><i class="bi bi-book"></i> Resources</a>
    </div>

    <div class="countdown">
      Redirecting to homepage in <span id="timer">15</span>s...
    </div>
  </div>

  <script>
    // Auto-redirect timer
    let seconds = 15;
    const timerEl = document.getElementById('timer');
    const interval = setInterval(() => {
      seconds--;
      if (timerEl) timerEl.textContent = seconds;
      if (seconds <= 0) {
        clearInterval(interval);
        window.location.href = '/index.html';
      }
    }, 1000);
  </script>

</body>
</html>
