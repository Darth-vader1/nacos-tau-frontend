<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>Reset Password | NACOS - Thomas Adewumi University</title>
  <meta name="description" content="Reset your NACOS account password.">
  <link href="assets/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
  <link href="assets/vendor/bootstrap-icons/bootstrap-icons.css" rel="stylesheet">
  <link href="assets/css/main.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    .loginForm { 
      max-width: 600px; 
      margin: 80px auto 40px; 
      padding: 30px; 
      background: white; 
      border-radius: 12px; 
      box-shadow: 0 16px 40px rgba(0,0,0,.08); 
    }
    .logo-underlay { 
      display: block; 
      margin: 0 auto 20px; 
      max-width: 80px; 
    }
    .form-control { 
      width: 100%; 
      padding: 12px 14px; 
      border: 1px solid #ddd; 
      border-radius: 8px; 
    }
    .form-control:focus { 
      outline: none; 
      border-color: #1b8c0c; 
      box-shadow: 0 0 10px rgba(27,140,12,.15); 
    }
    .btn-submit { 
      background-color: #1b8c0c; 
      color: white; 
      border: none; 
      padding: 12px 22px; 
      border-radius: 8px; 
      font-size: 16px; 
      cursor: pointer;
    }
    .btn-submit:hover { 
      background-color: #166a0a; 
    }
    .btn-submit:disabled {
      background-color: #ccc;
      cursor: not-allowed;
    }
    .text-muted.link { 
      color: #1b8c0c; 
      text-decoration: none; 
    }
    .password-container {
      position: relative;
    }
    .toggle-password {
      position: absolute;
      right: 10px;
      top: 38px;
      background: none;
      border: none;
      cursor: pointer;
      font-size: 18px;
      color: #666;
    }
    .password-requirements {
      font-size: 13px;
      color: #666;
      margin-top: 8px;
      padding-left: 20px;
    }
    .password-requirements li {
      margin-bottom: 4px;
    }
    .password-requirements li.met {
      color: #1b8c0c;
    }
    .password-requirements li.unmet {
      color: #dc3545;
    }
  </style>
</head>
<body>
  <main>
    <section class="starter-section section">
      <div class="loginForm">
        <img src="assets/img/tau_logo-removebg-preview.png" class="logo-underlay" alt="TAU Logo">
        <div class="container section-title" data-aos="fade-up">
          <h2>Reset Password</h2>
          <p>Enter your new password below.</p>
          <div style="background: #fff3cd; border-left: 4px solid #ffc107; padding: 12px; margin: 15px 0; border-radius: 4px;">
            <small style="color: #856404; display: block;">
              <i class="bi bi-info-circle"></i> 
              <strong>Important:</strong> Your new password must be different from your current password.
            </small>
          </div>
        </div>

        <div class="container" data-aos="fade-up" style="margin: 0; padding: 0;">
          <form id="resetPasswordForm">
            <div class="form-group password-container">
              <label for="newPassword">New Password:</label>
              <input 
                type="password" 
                class="form-control" 
                id="newPassword" 
                placeholder="Enter new password" 
                required 
                autocomplete="new-password"
              >
              <button id="toggle-new-password" class="toggle-password" type="button" aria-label="Toggle password visibility">
                <i class="bi bi-eye-slash"></i>
              </button>
            </div>
            
            <ul class="password-requirements">
              <li id="req-length" class="unmet">At least 8 characters</li>
              <li id="req-uppercase" class="unmet">One uppercase letter</li>
              <li id="req-lowercase" class="unmet">One lowercase letter</li>
              <li id="req-number" class="unmet">One number</li>
            </ul>

            <div class="form-group password-container" style="margin-top: 20px;">
              <label for="confirmPassword">Confirm Password:</label>
              <input 
                type="password" 
                class="form-control" 
                id="confirmPassword" 
                placeholder="Confirm new password" 
                required 
                autocomplete="new-password"
              >
              <button id="toggle-confirm-password" class="toggle-password" type="button" aria-label="Toggle password visibility">
                <i class="bi bi-eye-slash"></i>
              </button>
              <small id="password-match-msg" class="text-muted"></small>
            </div>

            <div style="display:flex; justify-content:center; margin-top:24px;">
              <button type="submit" class="btn-submit" id="submitBtn">Reset Password</button>
            </div>
          </form>

          <div style="text-align: center; margin-top: 20px;">
            <a href="student-login.html" class="text-muted link">Back to login</a>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script src="assets/js/env.js"></script>
  <script type="module">
    import { supabase } from './assets/js/supabase-config.js';
    
    const form = document.getElementById('resetPasswordForm');
    const newPasswordInput = document.getElementById('newPassword');
    const confirmPasswordInput = document.getElementById('confirmPassword');
    const submitBtn = document.getElementById('submitBtn');
    const passwordMatchMsg = document.getElementById('password-match-msg');

    // Toggle password visibility
    function setupToggle(toggleBtnId, inputId) {
      const toggleBtn = document.getElementById(toggleBtnId);
      const input = document.getElementById(inputId);
      
      toggleBtn.addEventListener('click', () => {
        const type = input.type === 'password' ? 'text' : 'password';
        input.type = type;
        const icon = toggleBtn.querySelector('i');
        icon.classList.toggle('bi-eye');
        icon.classList.toggle('bi-eye-slash');
      });
    }

    setupToggle('toggle-new-password', 'newPassword');
    setupToggle('toggle-confirm-password', 'confirmPassword');

    // Password strength validation
    const requirements = {
      length: { element: document.getElementById('req-length'), test: (pwd) => pwd.length >= 8 },
      uppercase: { element: document.getElementById('req-uppercase'), test: (pwd) => /[A-Z]/.test(pwd) },
      lowercase: { element: document.getElementById('req-lowercase'), test: (pwd) => /[a-z]/.test(pwd) },
      number: { element: document.getElementById('req-number'), test: (pwd) => /\d/.test(pwd) }
    };

    function validatePassword(password) {
      let allMet = true;
      for (const [key, req] of Object.entries(requirements)) {
        const met = req.test(password);
        req.element.className = met ? 'met' : 'unmet';
        if (!met) allMet = false;
      }
      return allMet;
    }

    newPasswordInput.addEventListener('input', () => {
      validatePassword(newPasswordInput.value);
      checkPasswordMatch();
    });

    confirmPasswordInput.addEventListener('input', checkPasswordMatch);

    function checkPasswordMatch() {
      const newPwd = newPasswordInput.value;
      const confirmPwd = confirmPasswordInput.value;

      if (!confirmPwd) {
        passwordMatchMsg.textContent = '';
        passwordMatchMsg.style.color = '';
        return;
      }

      if (newPwd === confirmPwd) {
        passwordMatchMsg.textContent = '✓ Passwords match';
        passwordMatchMsg.style.color = '#1b8c0c';
      } else {
        passwordMatchMsg.textContent = '✗ Passwords do not match';
        passwordMatchMsg.style.color = '#dc3545';
      }
    }

    // Form submission
    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const newPassword = newPasswordInput.value;
      const confirmPassword = confirmPasswordInput.value;

      // Validate password strength
      if (!validatePassword(newPassword)) {
        await Swal.fire({
          title: 'Weak Password',
          text: 'Please ensure your password meets all requirements.',
          icon: 'warning',
          confirmButtonColor: '#1b8c0c'
        });
        return;
      }

      // Check passwords match
      if (newPassword !== confirmPassword) {
        await Swal.fire({
          title: 'Passwords Don\'t Match',
          text: 'Please ensure both passwords are identical.',
          icon: 'warning',
          confirmButtonColor: '#1b8c0c'
        });
        return;
      }

      // Show loading state
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Resetting...';

      try {
        // Update password using Supabase
        const { data, error } = await supabase.auth.updateUser({
          password: newPassword
        });

        if (error) {
          console.error('Password reset error:', error);
          throw error;
        }

        // Success
        await Swal.fire({
          title: 'Success!',
          text: 'Your password has been reset successfully.',
          icon: 'success',
          confirmButtonColor: '#1b8c0c',
          confirmButtonText: 'Go to Login'
        });

        // Redirect to login
        window.location.href = 'student-login.html';

      } catch (err) {
        console.error('Reset password error:', err);

        let errorMessage = 'Failed to reset password. Please try again.';
        
        // Handle specific error cases with user-friendly messages
        if (err.message?.includes('New password should be different from the old password')) {
          errorMessage = 'Your new password must be different from your current password. Please choose a different password.';
        } else if (err.message?.includes('session')) {
          errorMessage = 'Your reset link has expired or is invalid. Please request a new one.';
        } else if (err.message?.includes('Same password')) {
          errorMessage = 'Please choose a different password from your current one.';
        } else if (err.message?.includes('Password is too weak')) {
          errorMessage = 'This password is too common or weak. Please choose a stronger password.';
        } else if (err.message?.includes('rate limit')) {
          errorMessage = 'Too many attempts. Please wait a few minutes and try again.';
        }

        await Swal.fire({
          title: 'Cannot Reset Password',
          text: errorMessage,
          icon: 'warning',
          confirmButtonColor: '#1b8c0c'
        });

      } finally {
        // Reset button state
        submitBtn.disabled = false;
        submitBtn.innerHTML = 'Reset Password';
      }
    });

    // Check if user has a valid recovery session
    window.addEventListener('DOMContentLoaded', async () => {
      try {
        const { data: { session } } = await supabase.auth.getSession();
        
        if (!session) {
          await Swal.fire({
            title: 'Invalid or Expired Link',
            text: 'This password reset link is invalid or has expired. Please request a new one.',
            icon: 'error',
            confirmButtonColor: '#1b8c0c',
            confirmButtonText: 'Go to Forgot Password'
          });
          window.location.href = 'forgot-password.html';
        }
      } catch (error) {
        console.error('Session check error:', error);
      }
    });
  </script>

  <style>
    .spinner-border-sm {
      display: inline-block;
      width: 1rem;
      height: 1rem;
      vertical-align: text-bottom;
      border: 0.2em solid currentColor;
      border-right-color: transparent;
      border-radius: 50%;
      animation: spinner-border 0.75s linear infinite;
    }

    @keyframes spinner-border {
      to { transform: rotate(360deg); }
    }
  </style>
</body>
</html>
