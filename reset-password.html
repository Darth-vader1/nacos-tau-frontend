<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>Password Reset | NACOS - Thomas Adewumi University</title>
  <meta name="description" content="Complete your NACOS password reset and update your login credentials.">
  <link href="assets/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
  <link href="assets/vendor/bootstrap-icons/bootstrap-icons.css" rel="stylesheet">
  <link href="assets/css/main.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    .loginForm { max-width: 620px; margin: 80px auto 40px; padding: 32px; background: white; border-radius: 14px; box-shadow: 0 20px 60px rgba(0,0,0,.08); }
    .logo-underlay { display: block; margin: 0 auto 22px; max-width: 90px; }
    .form-control { width: 100%; padding: 12px 14px; border: 1px solid #ddd; border-radius: 8px; }
    .form-control:focus { outline: none; border-color: #1b8c0c; box-shadow: 0 0 10px rgba(27,140,12,.15); }
    .btn-submit { background-color: #1b8c0c; color: white; border: none; padding: 12px 22px; border-radius: 8px; font-size: 16px; }
    .btn-submit:hover { background-color: #166a0a; }
    .status-message { margin: 20px 0; }
    .text-muted.link { color: #1b8c0c; text-decoration: none; }
  </style>
</head>
<body>
  <main>
    <section class="starter-section section">
      <div class="loginForm">
        <img src="assets/img/tau_logo-removebg-preview.png" class="logo-underlay" alt="TAU Logo">
        <div class="container section-title" data-aos="fade-up">
          <h2>Password Reset</h2>
          <p>Enter a new secure password below to complete your reset.</p>
          <a href="student-login.html">Back to login</a>
        </div>

        <div class="container" data-aos="fade-up" style="margin: 0; padding: 0;">
          <div id="statusBox" class="status-message text-center p-4 rounded" style="background:#f7fbf6; border:1px solid #d4ecd6; color:#1f4723;">
            <p style="margin:0; font-size: 16px;">Loading password reset form...</p>
          </div>

          <form id="resetPasswordForm" style="display:none; margin-top:24px;">
            <div class="form-group mb-3">
              <label for="newPassword">New Password</label>
              <input type="password" class="form-control" id="newPassword" placeholder="Enter new password" required minlength="8" autocomplete="new-password">
            </div>
            <div class="form-group mb-3">
              <label for="confirmPassword">Confirm Password</label>
              <input type="password" class="form-control" id="confirmPassword" placeholder="Confirm new password" required autocomplete="new-password">
            </div>
            <div style="display:flex; justify-content:center; margin-top:24px;">
              <button type="submit" class="btn-submit">Save New Password</button>
            </div>
          </form>
        </div>
      </div>
    </section>
  </main>

  <script type="module">
    import { supabase } from './assets/js/supabase-config.js';

    const params = new URLSearchParams(window.location.search);
    const statusBox = document.getElementById('statusBox');
    const resetForm = document.getElementById('resetPasswordForm');
    const newPasswordInput = document.getElementById('newPassword');
    const confirmPasswordInput = document.getElementById('confirmPassword');

    function showStatus(message, options = {}) {
      const { type = 'info' } = options;
      statusBox.innerHTML = `<p style="margin:0; font-size: 16px; color: ${type === 'error' ? '#842029' : '#1f4723'};">${message}</p>`;
      statusBox.style.background = type === 'error' ? '#f8d7da' : '#f7fbf6';
      statusBox.style.borderColor = type === 'error' ? '#f5c2c7' : '#d4ecd6';
      statusBox.style.color = type === 'error' ? '#842029' : '#1f4723';
    }

    async function init() {
      const accessToken = params.get('access_token');
      const error = params.get('error_description') || params.get('error');
      const type = params.get('type');

      if (error) {
        showStatus(`Unable to complete password reset: ${error}`, { type: 'error' });
        return;
      }

      if (!accessToken || type !== 'recovery') {
        showStatus('Invalid or expired reset link. Please request a new password reset from the login page.', { type: 'error' });
        return;
      }

      const { data: sessionData, error: sessionError } = await supabase.auth.getSession();
      if (sessionError) {
        console.error('Session read error:', sessionError.message);
      }

      showStatus('Your reset link is valid. Enter a new password below to complete the process.');
      resetForm.style.display = 'block';
    }

    resetForm.addEventListener('submit', async (event) => {
      event.preventDefault();

      const newPassword = newPasswordInput.value.trim();
      const confirmPassword = confirmPasswordInput.value.trim();

      if (!newPassword || !confirmPassword) {
        Swal.fire('Missing password', 'Please enter and confirm your new password.', 'warning');
        return;
      }

      if (newPassword !== confirmPassword) {
        Swal.fire('Password mismatch', 'The passwords do not match. Please try again.', 'warning');
        return;
      }

      if (newPassword.length < 8) {
        Swal.fire('Weak password', 'Your password must be at least 8 characters.', 'warning');
        return;
      }

      try {
        showStatus('Saving your new password...', { type: 'info' });
        const { data, error } = await supabase.auth.updateUser({ password: newPassword });

        if (error) {
          console.error('Password update failed:', error);
          showStatus('Unable to update your password. Please try again or request a new reset link.', { type: 'error' });
          return;
        }

        Swal.fire({
          title: 'Password Updated',
          text: 'Your password has been reset successfully. Please login with your new password.',
          icon: 'success',
          confirmButtonColor: '#1b8c0c'
        }).then(() => {
          window.location.href = 'student-login.html';
        });
      } catch (err) {
        console.error('Reset submission error:', err);
        showStatus('Something went wrong while resetting your password. Please try again later.', { type: 'error' });
      }
    });

    init();
  </script>
</body>
</html>
